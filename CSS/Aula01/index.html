<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>
    <!--CSS embedded(Embutido) -->
<style>
p{font-size: 200px;color: yellow;
}

#sheila{font-size: 200px; color: red;

}
</style>

</head>
<body>
    <!-- CSS inline é aquele que vai dentro da própria tag (PERDE PONTO) -->
    <p style="color: rgb(2, 184, 69); font-size: 200px;">Guilherme</p>
    <p>Salém</p>
    <p id="sheila">Sheila</p>
    
</body>
</html>
